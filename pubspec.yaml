name: loditech
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  google_maps_flutter: ^2.5.0
  location: ^5.0.0
  flutter_polyline_points: ^2.0.0
  flutter_tts: ^3.8.0
  firebase_core: ^2.30.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
