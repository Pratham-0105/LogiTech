dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

# ✅ MOVE THIS OUTSIDE
flutter_native_splash:
  color: "#ffffff"
